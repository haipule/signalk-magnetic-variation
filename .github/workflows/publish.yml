name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Publish when this version is not already on npm
        run: |
          if node -e 'const p = require("./package.json"); fetch(`https://registry.npmjs.org/${p.name}/${p.version}`).then(response => process.exit(response.ok ? 0 : 1))'; then
            echo "$npm_package_name@$npm_package_version is already published"
          else
            npm publish --access public
          fi
